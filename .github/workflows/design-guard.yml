name: FRANKIES design guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: Check the site still matches the approved FRANKIES design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the design guard
        run: node scripts/check-baseline.mjs --ci
